# ============================================================
# CamKit3D skeleton descriptor — MediaPipe Holistic (543 kp)
# ------------------------------------------------------------
# Describes the combined 543-landmark skeleton produced by
# MediaPipe Holistic: 33 body (pose) + 468 face mesh + 21 left
# hand + 21 right hand, concatenated into one index space. The
# 33 pose landmarks occupy indices 0-32, identical to the
# mediapipe_pose skeleton, so anything written against pose
# indices works on this skeleton too.
#
# See docs/skeletons.md for the schema reference.
# ============================================================

metadata:
  skeleton_id: mediapipe_holistic
  name: MediaPipe Holistic (Pose + Face + Hands)
  description: >-
    Combined 543-landmark topology from MediaPipe Holistic (legacy
    mp.solutions.holistic): 33 pose + 468 face + 21 left-hand +
    21 right-hand. Pose indices 0-32 match the mediapipe_pose skeleton.
  num_landmarks: 543
  model: mediapipe.solutions.holistic
  source: https://github.com/google-ai-edge/mediapipe/blob/master/docs/solutions/holistic.md
  coordinate_system: image pixels (x, y); z relative depth where available
  units: px
  schema_version: 1.0
  # Index ranges [start, end] inclusive for each landmark block.
  # Lets you slice out one body part, or drop the face mesh entirely.
  blocks:
    pose:  [0, 32]
    face:  [33, 500]
    left_hand:  [501, 521]
    right_hand: [522, 542]

# ── Landmarks ────────────────────────────────────────────────
# All 543 keypoints, one per row, ordered pose -> face -> left
# hand -> right hand. `index` is the position in the coordinate
# array; `name` is prefixed by block (pose_, face_, lh_, rh_);
# `group` ties it to a body part; `side` is left / right / center.
# Most face-mesh points are named face_<n> by their mesh index;
# a few salient ones carry readable names (e.g. face_nose_tip).
