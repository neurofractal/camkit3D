# ── Anatomy anchors ──────────────────────────────────────────
# Fixed anatomical role -> landmark index. Identical to the
# mediapipe_pose anchors because the pose block shares its indices,
# so orientation/alignment behaves the same on both skeletons.
anatomy:
  nose: 0
  left_shoulder: 11
  right_shoulder: 12
  left_hip: 23
  right_hip: 24
  left_ankle: 27
  right_ankle: 28
  left_wrist: 15
  right_wrist: 16

# ── Semantic roles ───────────────────────────────────────────
# Maps a coarse role to the group(s) that make it up, so code can
# ask for "the hands" without knowing this skeleton splits them
# into left_hand and right_hand. `body` is everything not face/hand.
roles:
  face: [face]
  hand: [left_hand, right_hand]

