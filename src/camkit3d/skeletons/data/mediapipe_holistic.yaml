# ── Groups ───────────────────────────────────────────────────
# Named sets of landmarks. `pose`, `face`, `left_hand`, `right_hand`
# are the four capture blocks; the rest (torso, arms, legs,
# pose_face) are body-part subsets of the pose block, used for
# colouring. `color` is the draw colour; `confidence_threshold` is
# the minimum trusted detection confidence. Note: only pose
# landmarks carry a real confidence score — face and hand points
# are reported as present (1.0) or absent (0.0), so their threshold
# acts as a presence test, not a graded cutoff.
